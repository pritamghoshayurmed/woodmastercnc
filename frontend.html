<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woodmaster CNC Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b141a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: #111b21;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }

        header {
            background-color: #202c33;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .header-subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .chat-area {
            flex: 1;
            background-image: url('https://i.imgur.com/8W7iX9K.png');
            background-color: #0b141a;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.sent {
            align-self: flex-end;
            background-color: #005c4b;
            color: #e9edef;
            border-top-right-radius: 0;
        }

        .message.received {
            align-self: flex-start;
            background-color: #202c33;
            color: #e9edef;
            border-top-left-radius: 0;
        }
        
        .message-image {
            max-width: 100%;
            border-radius: 5px;
            margin-top: 8px;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background-color: #202c33;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            margin-right: 10px;
            outline: none;
            background-color: #2a3942;
            color: #e9edef;
        }

        .send-btn {
            background-color: #008069;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #01896d;
        }
        
        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Loading indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #202c33;
            padding: 8px 12px;
            border-radius: 8px;
            font-style: italic;
            color: #c7d0d6;
            font-size: 0.85rem;
        }

        .quick-replies {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid #2e3d45;
        }

        .quick-reply-btn {
            background-color: transparent;
            color: #00a884;
            border: 0;
            border-top: 1px solid #2e3d45;
            padding: 14px 12px;
            text-align: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .quick-reply-btn:hover {
            background-color: #2a3942;
        }

        .interactive-card {
            max-width: 92%;
            align-self: flex-start;
            background-color: #202c33;
            border-radius: 12px;
            overflow: hidden;
            color: #e9edef;
        }

        .interactive-image {
            width: 100%;
            display: block;
            max-height: 280px;
            object-fit: cover;
            border-bottom: 1px solid #2e3d45;
        }

        .interactive-content {
            padding: 14px;
        }

        .interactive-content p {
            white-space: pre-wrap;
            line-height: 1.45;
            font-size: 1.05rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            width: min(90vw, 420px);
            background: #111b21;
            color: #e9edef;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .modal-card h3 {
            margin-bottom: 10px;
            color: #e9edef;
        }

        .modal-card p {
            color: #c7d0d6;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .modal-card input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #2e3d45;
            border-radius: 8px;
            outline: none;
            margin-bottom: 10px;
            background: #202c33;
            color: #e9edef;
        }

        .modal-card button {
            width: 100%;
            background-color: #008069;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-card button:hover {
            background-color: #005c4b;
        }

        .session-error {
            color: #c0392b;
            font-size: 0.85rem;
            min-height: 1rem;
            margin-bottom: 8px;
        }

        @media (max-width: 640px) {
            .container {
                height: 100vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-info">
            <div style="display: flex; align-items: center; gap: 5px;">
                <span class="header-title">Woodmaster CNC</span>
                <!-- Verified Badge inline SVG -->
                <svg viewBox="0 0 18 18" width="16" height="16" style="fill: #00a884;">
                    <path d="M9 1.144L7.568.125l-1.636.565-.632 1.6-1.726.155-.162 1.722-1.603.626L2.378 6.42 1 7.712l.608 1.62-.608 1.62 1.378 1.293-.569 1.627 1.603.626.162 1.722 1.726.155.632 1.6 1.636.565L9 16.856l1.432 1.019 1.636-.565.632-1.6 1.726-.155.162-1.722 1.603-.626L15.622 11.58l1.378-1.293-.608-1.62.608-1.62-1.378-1.293.568-1.627-1.603-.626-.162-1.722-1.726-.155-.632-1.6-1.636-.565L9 1.144zm4.07 5.67l-5.11 5.111-2.556-2.556.886-.886 1.67 1.67 4.224-4.225.886.886z"></path>
                </svg>
            </div>
            <span class="header-subtitle">online</span>
        </div>
    </header>

    <div class="chat-area" id="chatArea">
        <div class="typing-indicator" id="typingIndicator">Woodmaster CNC is typing...</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" id="sendBtn">▶</button>
    </div>
</div>

<div class="modal-overlay" id="sessionModal">
    <div class="modal-card">
        <h3>Start New Session</h3>
        <p>Enter your mobile number as session ID to begin chatting with Woodmaster CNC.</p>
        <input type="text" id="sessionInput" placeholder="e.g. 919876543210" autocomplete="off">
        <div class="session-error" id="sessionError"></div>
        <button id="sessionStartBtn">Continue</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const sessionModal = document.getElementById('sessionModal');
    const sessionInput = document.getElementById('sessionInput');
    const sessionError = document.getElementById('sessionError');
    const sessionStartBtn = document.getElementById('sessionStartBtn');

    let sessionId = '';
    let waitingForResponse = false;

    function normalizeSessionId(raw) {
        return raw.trim().replace(/\s+/g, '');
    }

    function openSessionModal() {
        sessionModal.style.display = 'flex';
        sessionInput.focus();
    }

    function closeSessionModal() {
        sessionModal.style.display = 'none';
    }

    function saveSession() {
        const normalized = normalizeSessionId(sessionInput.value);
        const valid = /^[A-Za-z0-9:_+\-]{3,64}$/.test(normalized);
        if (!valid) {
            sessionError.textContent = 'Please enter a valid session ID (3-64 chars).';
            return;
        }

        sessionId = normalized;
        localStorage.setItem('wmcnc_session_id', sessionId);
        sessionError.textContent = '';
        closeSessionModal();
        messageInput.focus();
    }

    function addInteractiveCard(text, imageUrl, options = []) {
        const card = document.createElement('div');
        card.className = 'interactive-card';

        if (imageUrl) {
            const img = document.createElement('img');
            img.className = 'interactive-image';
            img.src = imageUrl.startsWith('/') ? imageUrl : `/${imageUrl}`;
            card.appendChild(img);
        }

        const content = document.createElement('div');
        content.className = 'interactive-content';
        const textP = document.createElement('p');
        textP.textContent = text;
        content.appendChild(textP);

        if (options.length > 0) {
            const quickReplyWrap = document.createElement('div');
            quickReplyWrap.className = 'quick-replies';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply-btn';
                btn.type = 'button';
                btn.textContent = `↩ ${option.label}`;
                btn.addEventListener('click', () => {
                    if (waitingForResponse) return;
                    sendMessage(option.value);
                });
                quickReplyWrap.appendChild(btn);
            });
            content.appendChild(quickReplyWrap);
        }

        card.appendChild(content);
        chatArea.insertBefore(card, typingIndicator);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addMessage(text, isSent, images = [], options = []) {
        if (!isSent && options.length > 0) {
            const firstImage = images.length > 0 ? images[0] : '';
            addInteractiveCard(text, firstImage, options);
            return;
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        msgDiv.textContent = text;
        
        // Add images if any
        images.forEach(imgUrl => {
            const imgEl = document.createElement('img');
            // Assuming image path comes relative from backend (like "data/images/...")
            const safeUrl = imgUrl.startsWith('/') ? imgUrl : `/${imgUrl}`;
            imgEl.src = safeUrl;
            imgEl.className = 'message-image';
            msgDiv.appendChild(imgEl);
        });

        chatArea.insertBefore(msgDiv, typingIndicator);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage(preFilledText = '') {
        const text = (preFilledText || messageInput.value).trim();

        if (!sessionId) {
            openSessionModal();
            return;
        }

        if (!text) return;
        if (waitingForResponse) return;

        // Display user message
        addMessage(text, true);
        messageInput.value = '';
        waitingForResponse = true;
        messageInput.disabled = true;
        sendBtn.disabled = true;
        
        typingIndicator.style.display = 'block';
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const response = await fetch('/webhook', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    session_id: sessionId,
                    message: text
                })
            });

            if (!response.ok) throw new Error("API Network error");
            const data = await response.json();
            
            typingIndicator.style.display = 'none';
            addMessage(data.reply, false, data.images || [], data.options || []);
        } catch (error) {
            typingIndicator.style.display = 'none';
            addMessage("Oops! Could not connect to the assistant.", false);
            console.error(error);
        } finally {
            waitingForResponse = false;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    sessionStartBtn.addEventListener('click', saveSession);
    sessionInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            saveSession();
        }
    });

    const storedSession = localStorage.getItem('wmcnc_session_id') || '';
    if (storedSession) {
        sessionInput.value = storedSession;
    }
    openSessionModal();

</script>
</body>
</html>
